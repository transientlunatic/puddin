# api.toml — Canonical registry of all public Puddin functions.
#
# Used by scripts/check_api_coverage.py (run in CI as the "api-coverage" job)
# to verify that every public Rust function is wired up in every binding layer.
#
# Update this file whenever you add, rename, or remove a function in
# crates/puddin/src/binary.rs.  The CI job will fail on any mismatch.
#
# Fields
#   rust_name  public fn name in crates/puddin/src/binary.rs
#   c_abi      symbol(s) exported by bindings/julia/src/lib.rs and puddin.h
#              (tuple-returning Rust fns split into multiple scalars)
#   cli        Rust identifier used in crates/puddin-cli/src/main.rs
#   python     function registered in bindings/python/src/lib.rs
#   julia      function defined in bindings/julia/src/Puddin.jl
#   r          function exported from bindings/r/R/puddin.R + NAMESPACE
#   wasm       user-facing export in bindings/wasm/js/puddin.ts
#              (the TypeScript wrapper; underlying Rust symbols may differ)

[[function]]
rust_name = "total_mass"
c_abi     = ["puddin_total_mass"]
cli       = "total_mass"
python    = "total_mass"
julia     = "total_mass"
r         = "total_mass"
wasm      = "total_mass"

