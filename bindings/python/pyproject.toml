[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "puddin"
version = "0.1.0"
description = "Mathematical and physical primitives for gravitational-wave astronomy"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "astropy>=5.0",
]

[project.optional-dependencies]
pint = ["pint>=0.23"]
jax = ["jax>=0.4"]
dev = [
    "pytest>=8",
    "pint>=0.23",
    "jax>=0.4",
    "astropy>=5.0",
]

[tool.maturin]
python-source = "python"
module-name = "puddin._puddin"
features = ["pyo3/extension-module"]
