name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual re-deploys from the Actions tab.
  workflow_dispatch:

# Required for the pages/write + id-token permissions below.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; skip queued runs but never cancel an
# in-progress deploy so a half-finished publish is never left on Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Sphinx docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # sphinx-rust runs rustfmt/rustdoc analysers, so the toolchain is needed.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install doc dependencies
        run: pip install -r docs/requirements.txt

      - name: Build HTML
        # -W: turn warnings into errors; -n: warn on missing references.
        # Remove -W if sphinx-rust produces spurious warnings on your version.
        run: sphinx-build -n -b html docs/ docs/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
