name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:

  # ── API coverage: every Rust function wired up in every binding layer ────────

  api-coverage:
    name: API coverage check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check all binding layers expose every public function
        run: python3 scripts/check_api_coverage.py

  # ── Rust formatting & linting ───────────────────────────────────────────────

  rust-checks:
    name: Rust — fmt & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        # puddin-julia is a workspace cdylib; puddin-wasm is verified by the
        # separate wasm-build job (requires --target wasm32-unknown-unknown).
        run: cargo clippy -p puddin -p puddin-julia -p puddin-cli -- -D warnings

  # ── Rust tests (unit, integration, doc-tests) ───────────────────────────────

  rust-tests:
    name: Rust — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test -p puddin

      - name: cargo doc
        run: cargo doc -p puddin --no-deps

      - name: Build CLI
        run: cargo build -p puddin-cli

      - name: CLI smoke-test
        run: |
          # 30+30 Msun equal-mass binary — canonical GW150914-like values
          mc=$(./target/debug/puddin chirp-mass 30 30)
          # chirp mass of equal-mass 30+30 system is ~26.117 Msun
          awk -v v="$mc" 'BEGIN { if (v < 26.1 || v > 26.2) { exit 1 } }'
          ./target/debug/puddin chi-eff 30 30 0.5 0.5 0 0  # aligned → 0.5
          ./target/debug/puddin mass-ratio 30 15             # → 0.5

  # ── Python build & test ─────────────────────────────────────────────────────

  python-tests:
    name: Python — build & test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install maturin and dev dependencies
        working-directory: bindings/python
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install "maturin>=1.7,<2.0"
          maturin develop --extras dev

      - name: pytest
        working-directory: bindings/python
        run: |
          source .venv/bin/activate
          pytest tests/ -v

  # ── Sphinx documentation build ──────────────────────────────────────────────

  docs:
    name: Docs — Sphinx build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # sphinx-rust runs the Rust analyzer, so the toolchain is required
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install doc dependencies
        run: pip install -r docs/requirements.txt

      - name: Build docs
        # -n: warn on missing references; -q: quiet; not -W yet because
        # sphinx-rust is early-stage and may produce spurious warnings.
        run: sphinx-build -n -b html docs/ docs/_build/html

  # ── WASM build & type-check ─────────────────────────────────────────────────

  wasm-build:
    name: WASM — wasm-pack build & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: wasm-pack build (bundler target)
        working-directory: bindings/wasm
        run: wasm-pack build --target bundler --out-dir pkg

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install TypeScript compiler
        run: npm install -g typescript

      - name: Copy TypeScript wrapper into pkg
        run: cp bindings/wasm/js/puddin.ts bindings/wasm/pkg/

      - name: Type-check TypeScript wrapper
        # Use moduleResolution so the .js extension in the import is resolved.
        run: |
          tsc --strict --noEmit --moduleResolution bundler \
              --target ES2022 --module ESNext \
              bindings/wasm/pkg/puddin.ts

      - name: Upload WASM package artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: bindings/wasm/pkg/

  # ── Julia build & test ──────────────────────────────────────────────────────

  julia-tests:
    name: Julia — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Rust shared library
        run: cargo build --release -p puddin-julia

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Run Julia tests
        working-directory: bindings/julia
        run: julia --project=. test/runtests.jl

  # ── R build & test ──────────────────────────────────────────────────────────

  r-tests:
    name: R — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Rust shared library
        run: cargo build --release -p puddin-julia

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install testthat
        run: Rscript -e 'install.packages("testthat", repos = "https://cloud.r-project.org")'

      - name: Install R package
        run: R CMD INSTALL bindings/r

      - name: Run tests
        run: Rscript -e 'testthat::test_dir("bindings/r/tests/testthat", reporter = "progress")'
