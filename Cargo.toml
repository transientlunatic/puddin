[workspace]
members = [
    "crates/puddin",
    "crates/puddin-cli",
    # bindings/wasm and bindings/julia are standard cdylib crates that can be
    # checked on a native host without special toolchains.
    "bindings/wasm",
    "bindings/julia",
    # bindings/python is intentionally excluded from the default workspace.
    # It is built exclusively through maturin, which injects the required
    # pyo3/extension-module feature.  Including it here would cause
    # `cargo test --workspace` to link against libpython, requiring Python
    # dev headers in the Rust build environment.
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = []
license = "MIT OR Apache-2.0"
repository = ""

[workspace.dependencies]
puddin = { path = "crates/puddin" }
uom = { version = "0.36", features = ["f64", "si"] }
clap = { version = "4", features = ["derive"] }
proptest = "1"
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"

# lto = true is beneficial for all targets (better codegen, slightly slower CI).
# opt-level = "z" is overridden per-package for WASM below.
[profile.release]
lto = true

# Shrink the WASM binary: it is downloaded by end-users so size matters.
# This is intentionally more aggressive than the workspace default above.
[profile.release.package.puddin-wasm]
opt-level = "z"
